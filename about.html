<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>關於實驗室 About | 海上智慧視覺感知實驗室</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="about">
<header class="site-header" id="site-header"></header>

<div class="page-header">
  <div class="wrap">
    <h1>關於實驗室</h1>
    <p class="en">About the Laboratory</p>
  </div>
</div>

<main>
  <div class="wrap">
    <section>
      <h2>簡介<span class="en-sub">Overview</span></h2>
      <p id="about-intro"></p>
    </section>

    <section>
      <h2>所屬單位<span class="en-sub">Affiliation</span></h2>
      <p id="about-institution"></p>
    </section>

    <section>
      <h2>實驗室負責人<span class="en-sub">Principal Investigator</span></h2>
      <p id="about-pi"></p>
    </section>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="data/site.js"></script>
<script src="data/people.js"></script>
<script src="assets/js/common.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var s = window.SITE_DATA;
  var p = window.PEOPLE_DATA;
  if (!s) return;
  document.getElementById("about-intro").textContent = s.homeIntro.zh;
  document.getElementById("about-institution").textContent = s.institution.zh + "（" + s.institution.en + "）";
  if (p && p.pi && p.pi[0]) {
    document.getElementById("about-pi").textContent = p.pi[0].bio_zh || "";
  }
});
</script>
</body>
</html>
